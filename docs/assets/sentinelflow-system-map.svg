<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">SentinelFlow system map</title><desc id="desc">Detection enters the control plane, passes human approval, executes through allowlisted adapters, and produces an immutable report.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#101d35"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker></defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/><text x="52" y="48" fill="#f8fafc" font-family="Arial" font-size="24" font-weight="700">SentinelFlow · security response control plane</text>
  <g font-family="Arial" font-size="15" text-anchor="middle"><g fill="#102a43" stroke="#38bdf8"><rect x="48" y="126" width="150" height="90" rx="14"/><rect x="240" y="126" width="150" height="90" rx="14"/><rect x="432" y="126" width="150" height="90" rx="14"/><rect x="624" y="126" width="150" height="90" rx="14"/><rect x="816" y="126" width="150" height="90" rx="14"/><rect x="1008" y="126" width="145" height="90" rx="14"/></g><g fill="#f8fafc"><text x="123" y="160">AI-SOC</text><text x="123" y="184">signed detection</text><text x="315" y="160">Incident</text><text x="315" y="184">timeline / evidence</text><text x="507" y="160">Playbook</text><text x="507" y="184">versioned snapshot</text><text x="699" y="160">Approval</text><text x="699" y="184">quorum + RBAC</text><text x="891" y="160">Dispatcher</text><text x="891" y="184">lease / retry</text><text x="1080" y="160">Report</text><text x="1080" y="184">digest / audit</text></g></g>
  <g stroke="#7dd3fc" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M198 171h38"/><path d="M390 171h38"/><path d="M582 171h38"/><path d="M774 171h38"/><path d="M966 171h38"/></g>
  <g fill="#94a3b8" font-family="Arial" font-size="13"><text x="52" y="286">PostgreSQL · system of record</text><text x="430" y="286">Redis · leases / broker</text><text x="730" y="286">Vendor adapters · HTTPS + secret refs</text></g>
</svg>
